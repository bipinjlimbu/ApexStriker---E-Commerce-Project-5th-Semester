<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | ApexStriker</title>
    {% load static %}
    <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
</head>

<body class="bg-[#F8FAFC] flex flex-col min-h-screen font-sans antialiased selection:bg-[#D62828] selection:text-white">
    {% include 'components/_navbar.html' %}

    {% include 'components/_messages.html' %}

    <main class="flex-grow flex items-center justify-center py-16 px-4 sm:px-6 relative overflow-hidden">
        <div class="absolute -top-32 -left-32 w-96 h-96 bg-[#D62828]/5 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-[#0F172A]/5 rounded-full blur-3xl pointer-events-none"></div>

        <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl shadow-slate-200/80 border border-[#E5E7EB] relative overflow-hidden transition-all">
            <div class="h-2 w-full bg-gradient-to-r from-[#0F172A] via-[#D62828] to-[#F4B400]"></div>

            <div class="p-8 sm:p-10">
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-[#0F172A] text-[#F4B400] mb-5 shadow-lg shadow-[#0F172A]/20 border border-slate-800">
                        <i data-lucide="key-round" class="w-8 h-8"></i>
                    </div>

                    <h1 class="text-3xl font-black text-[#111827] tracking-tight uppercase italic">
                        Apex<span class="text-[#D62828]">Striker</span>
                    </h1>
                    <p class="text-sm font-bold text-[#475569] uppercase tracking-wider mt-1">Reset Password</p>
                </div>

                <p class="text-sm text-[#475569] mb-8 text-center leading-relaxed font-medium bg-[#F8FAFC] p-4 rounded-2xl border border-[#E5E7EB]">
                    Enter your email address below and we will send you a link to reset your password.
                </p>

                <form method="POST" action="/password-reset/" class="space-y-6">
                    {% csrf_token %}

                    <div class="space-y-2">
                        <label class="text-xs font-black text-[#111827] uppercase tracking-wider flex items-center gap-2">
                            <i data-lucide="mail" class="w-4 h-4 text-[#D62828]"></i>
                            Email Address
                        </label>
                        <div class="relative">
                            <input type="email" name="email" placeholder="name@example.com" required
                                   class="w-full px-4 py-3.5 bg-[#F8FAFC] border border-[#E5E7EB] rounded-xl text-[#111827] text-sm font-medium placeholder:text-slate-400 focus:bg-white focus:border-[#D62828] focus:ring-4 focus:ring-[#D62828]/10 transition-all outline-none">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-[#D62828] hover:bg-[#A61E1E] text-white font-black py-4 px-6 rounded-xl shadow-lg shadow-[#D62828]/25 hover:shadow-xl hover:shadow-[#D62828]/35 transition-all duration-200 active:scale-[0.98] flex items-center justify-center gap-2.5 text-sm uppercase tracking-wider cursor-pointer group">
                        <i data-lucide="send" class="w-4 h-4 transition-transform group-hover:translate-x-1"></i>
                        Send Reset Link
                    </button>
                </form>

                <div class="mt-8 pt-6 border-t border-[#E5E7EB] text-center">
                    <a href="/login/" class="inline-flex items-center justify-center gap-2 text-xs font-bold text-[#475569] hover:text-[#D62828] transition-colors group">
                        <i data-lucide="arrow-left" class="w-4 h-4 transition-transform group-hover:-translate-x-1"></i>
                        Back to Login
                    </a>
                </div>
            </div>
        </div>
    </main>

    {% include 'components/_footer.html' %}

    <script src="{% static 'js/lucide.min.js' %}"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
